<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlateGuessr - Zgadnij tablicę rejestracyjną!</title>
    <!-- Biblioteka Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #1a1a1a;
            color: #fff;
            overflow: hidden;
            position: relative;
        }

        /* Ekran startowy */
        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            text-align: center;
            padding: 20px;
        }

        #start-screen h1 {
            font-size: 3.5rem;
            color: #f59e0b;
            margin-bottom: 10px;
            text-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        #start-screen p {
            font-size: 1.2rem;
            color: #94a3b8;
            margin-bottom: 30px;
        }

        /* Górny panel z tablicą */
        #game-header {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 2;
        }

        .header-info {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .timer-info {
            font-size: 1rem;
            color: #38bdf8;
            font-weight: 600;
        }

        .score-info {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #f59e0b;
        }

        /* Stylowy napis PlateGuessr™ na środku nagłówka */
        .game-brand {
            font-size: 2.2rem;
            font-weight: 900;
            color: #f59e0b;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
            text-shadow: 0 2px 10px rgba(245, 158, 11, 0.4);
        }

        /* Polska tablica rejestracyjna */
        .license-plate {
            background-color: #ffffff;
            border: 4px solid #000000;
            border-radius: 8px;
            display: flex;
            align-items: center;
            padding: 5px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.6);
            min-width: 320px;
            height: 90px;
            position: relative;
        }

        .euroband {
            background-color: #003399;
            width: 35px;
            height: 100%;
            border-radius: 3px 0 0 3px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 5px 0;
            color: white;
            font-size: 10px;
            font-weight: bold;
        }

        .stars {
            color: #ffcc00;
            font-size: 8px;
            text-align: center;
            line-height: 8px;
        }

        .plate-text {
            flex: 1;
            color: #000000;
            font-size: 3rem;
            font-weight: 900;
            text-align: center;
            letter-spacing: 5px;
            font-family: 'Courier New', Courier, monospace;
            text-transform: uppercase;
        }

        /* Mapa */
        #map-container {
            flex: 2;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* Przycisk strzału */
        #controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
        }

        .btn {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: #059669;
            transform: scale(1.05);
        }

        .btn:disabled {
            background-color: #64748b;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background-color: #3b82f6;
        }

        .btn-secondary:hover {
            background-color: #2563eb;
        }

        .btn-large {
            padding: 16px 36px;
            font-size: 1.3rem;
        }

        /* Podpis w lewym dolnym rogu */
        #footer-copyright {
            position: absolute;
            bottom: 8px;
            left: 15px;
            z-index: 1000;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
            pointer-events: none;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }

        /* Okienko z wynikiem rundy / tabelą wyników */
        #result-modal {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.95);
            padding: 25px 30px;
            border-radius: 15px;
            border: 2px solid #334155;
            text-align: center;
            z-index: 2000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            width: 380px;
            max-width: 90vw;
            max-height: 85vh;
            overflow-y: auto;
        }

        #result-modal h2 {
            margin-bottom: 12px;
            color: #f59e0b;
        }

        #result-modal p {
            margin: 8px 0;
            font-size: 1.05rem;
        }

        /* Sekcja wpisywania nicku */
        #save-score-section {
            display: none;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #334155;
        }

        #player-name-input {
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #475569;
            background-color: #1e293b;
            color: #fff;
            font-size: 1rem;
            width: 70%;
            margin-bottom: 10px;
            text-align: center;
            outline: none;
        }

        #player-name-input:focus {
            border-color: #3b82f6;
        }

        /* Tabela wyników (domyślnie ukryta) */
        #leaderboard-section {
            display: none;
            margin-top: 15px;
            text-align: left;
            background: #1e293b;
            border-radius: 8px;
            padding: 12px 15px;
            max-height: 180px;
            overflow-y: auto;
        }

        #leaderboard-section h3 {
            color: #f59e0b;
            text-align: center;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .leaderboard-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid #334155;
            font-size: 0.95rem;
        }

        .leaderboard-item:last-child {
            border-bottom: none;
        }

        .leaderboard-item .rank-name {
            font-weight: 600;
            color: #e2e8f0;
        }

        .leaderboard-item .score-val {
            color: #10b981;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Ekran startowy z przyciskiem Zagraj -->
    <div id="start-screen">
        <h1>PlateGuessr™</h1>
        <p>Zgadnij skąd pochodzi polska tablica rejestracyjna!</p>
        <button class="btn btn-large" onclick="startGame()">Zagraj</button>
    </div>

    <!-- Panel górny -->
    <div id="game-header">
        <div class="header-info">
            <div>Runda: <span id="round-num">1</span>/5</div>
            <div class="timer-info">Czas: <span id="timer">0.0</span>s</div>
        </div>
        <div class="score-info">Wynik: <span id="total-score">0</span> pkt</div>

        <div class="game-brand">PlateGuessr™</div>

        <div class="license-plate">
            <div class="euroband">
                <div class="stars">★<br>★</div>
                <div>PL</div>
            </div>
            <div class="plate-text" id="plate-code">---</div>
        </div>
        <p style="margin-top: 10px; color: #94a3b8; font-size: 0.9rem;">Wskąż na mapie, skąd pochodzi ten wyróżnik!</p>
    </div>

    <!-- Panel mapy -->
    <div id="map-container">
        <div id="map"></div>
        <div id="controls">
            <button id="guess-btn" class="btn" disabled onclick="makeGuess()">Zatwierdź strzał</button>
        </div>
        <!-- Copyright w lewym dolnym rogu -->
        <div id="footer-copyright">Tobiasz Gawron ©Copyright</div>
    </div>

    <!-- Wynik rundy i Tabela Wyników -->
    <div id="result-modal">
        <h2 id="result-title">Wynik rundy</h2>
        <p id="result-location"></p>
        <p id="result-distance"></p>
        <p id="result-points" style="font-size: 1.3rem; font-weight: bold; color: #10b981;"></p>

        <!-- Sekcja podpisu po zakończeniu 5 rund -->
        <div id="save-score-section">
            <p style="font-size: 0.95rem; color: #cbd5e1; margin-bottom: 8px;">Wpisz swój nick, aby zapisać wynik:</p>
            <input type="text" id="player-name-input" placeholder="Twój nick" maxlength="15">
            <br>
            <button class="btn btn-secondary" onclick="saveScore()">Zapisz wynik</button>
        </div>

        <!-- Tabela wyników -->
        <div id="leaderboard-section">
            <h3>🏆 Tabela Wyników</h3>
            <ol id="leaderboard-list" class="leaderboard-list">
                <!-- Wyniki generowane dynamicznie -->
            </ol>
        </div>

        <button id="next-btn" class="btn" style="margin-top: 15px;" onclick="nextRound()">Następna runda</button>
    </div>

    <!-- Biblioteka Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const platesData = [
            { code: "KR", name: "Kraków", lat: 50.0647, lng: 19.9450 },
            { code: "WA", name: "Warszawa", lat: 52.2297, lng: 21.0122 },
            { code: "PO", name: "Poznań", lat: 52.4064, lng: 16.9252 },
            { code: "GD", name: "Gdańsk", lat: 54.3520, lng: 18.6466 },
            { code: "DW", name: "Wrocław", lat: 51.1100, lng: 17.0333 },
            { code: "SK", name: "Katowice", lat: 50.2649, lng: 19.0238 },
            { code: "LD", name: "Łódź", lat: 51.7592, lng: 19.4560 },
            { code: "ZS", name: "Szczecin", lat: 53.4285, lng: 14.5528 },
            { code: "LU", name: "Lublin", lat: 51.2465, lng: 22.5684 },
            { code: "BI", name: "Białystok", lat: 53.1325, lng: 23.1688 },
            { code: "RZ", name: "Rzeszów", lat: 50.0412, lng: 21.9991 },
            { code: "GA", name: "Gdynia", lat: 54.5189, lng: 18.5305 },
            { code: "DB", name: "Wałbrzych", lat: 50.7711, lng: 16.2839 },
            { code: "NE", name: "Elbląg", lat: 54.1561, lng: 19.4045 },
            { code: "OP", name: "Opole", lat: 50.6721, lng: 17.9253 },
            { code: "NO", name: "Olsztyn", lat: 53.7784, lng: 20.4801 },
            { code: "ZG", name: "Zielona Góra", lat: 51.9356, lng: 15.5064 },
            { code: "CB", name: "Bydgoszcz", lat: 53.1235, lng: 18.0084 },
            { code: "CT", name: "Toruń", lat: 53.0138, lng: 18.5984 },
            { code: "KNS", name: "Nowy Sącz", lat: 49.6249, lng: 20.6902 },
            { code: "KNT", name: "Nowy Targ", lat: 49.4831, lng: 20.0322 },
            { code: "CZE", name: "Częstochowa", lat: 50.8118, lng: 19.1203 },
            { code: "RPR", name: "Przemyśl", lat: 49.7839, lng: 22.7676 },
            { code: "GDA", name: "Pruszcz Gdański", lat: 54.2606, lng: 18.6361 },
            { code: "PS", name: "Swarzędz / Powiat Poznański", lat: 52.4150, lng: 17.2400 }
        ];

        const defaultLeaderboard = [];

        let currentRound = 1;
        const totalRounds = 5;
        let totalScore = 0;
        let currentTarget = null;
        let playerMarker = null;
        let targetMarker = null;
        let polyline = null;
        let selectedLocation = null;
        let usedPlates = [];

        let startTime = 0;
        let elapsedTime = 0;
        let timerInterval = null;

        const map = L.map('map').setView([52.0693, 19.4803], 6);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        function getLeaderboard() {
            const saved = localStorage.getItem('plateguessr_leaderboard');
            if (saved) {
                return JSON.parse(saved);
            }
            return defaultLeaderboard;
        }

        function updateLeaderboardUI() {
            const leaderboard = getLeaderboard();
            const listEl = document.getElementById('leaderboard-list');
            listEl.innerHTML = '';

            leaderboard.forEach((entry, idx) => {
                const li = document.createElement('li');
                li.className = 'leaderboard-item';
                li.innerHTML = `
                    <span class="rank-name">${idx + 1}. ${entry.name}</span>
                    <span class="score-val">${entry.score} pkt (${entry.time}s)</span>
                `;
                listEl.appendChild(li);
            });
        }

        map.on('click', function(e) {
            if (document.getElementById('result-modal').style.display === 'block') return;
            if (document.getElementById('start-screen').style.display !== 'none') return;

            selectedLocation = e.latlng;

            if (playerMarker) {
                playerMarker.setLatLng(selectedLocation);
            } else {
                playerMarker = L.marker(selectedLocation).addTo(map);
            }

            document.getElementById('guess-btn').disabled = false;
        });

        function startTimer() {
            startTime = Date.now();
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                elapsedTime = (Date.now() - startTime) / 1000;
                document.getElementById('timer').innerText = elapsedTime.toFixed(1);
            }, 100);
        }

        function stopTimer() {
            clearInterval(timerInterval);
        }

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            startRound();
        }

        function startRound() {
            if (playerMarker) map.removeLayer(playerMarker);
            if (targetMarker) map.removeLayer(targetMarker);
            if (polyline) map.removeLayer(polyline);
            
            playerMarker = null;
            targetMarker = null;
            polyline = null;
            selectedLocation = null;

            document.getElementById('guess-btn').disabled = true;
            document.getElementById('result-modal').style.display = 'none';
            document.getElementById('save-score-section').style.display = 'none';
            document.getElementById('leaderboard-section').style.display = 'none';

            let availablePlates = platesData.filter(p => !usedPlates.includes(p.code));
            if (availablePlates.length === 0) {
                usedPlates = [];
                availablePlates = [...platesData];
            }
            
            currentTarget = availablePlates[Math.floor(Math.random() * availablePlates.length)];
            usedPlates.push(currentTarget.code);

            document.getElementById('plate-code').innerText = currentTarget.code + " " + generateRandomSuffix();
            map.invalidateSize();
            map.setView([52.0693, 19.4803], 6);

            startTimer();
        }

        function generateRandomSuffix() {
            const chars = "1234567890ABCDEFGHJKLMNPRSTUWVXYZ";
            let res = "";
            for (let i = 0; i < 5; i++) {
                res += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return res.substring(0, 2) + " " + res.substring(2);
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = 
                Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        function calculatePoints(distanceKm) {
            if (distanceKm < 3) return 5000;
            return Math.max(0, Math.round(5000 * Math.exp(-distanceKm / 80)));
        }

        function makeGuess() {
            if (!selectedLocation) return;

            stopTimer();

            const targetLatLng = L.latLng(currentTarget.lat, currentTarget.lng);
            const distance = calculateDistance(
                selectedLocation.lat, selectedLocation.lng,
                currentTarget.lat, currentTarget.lng
            );

            const points = calculatePoints(distance);
            totalScore += points;

            targetMarker = L.marker(targetLatLng, {
                icon: L.icon({
                    iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-green.png',
                    shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                    iconSize: [25, 41],
                    iconAnchor: [12, 41],
                    popupAnchor: [1, -34],
                    shadowSize: [41, 41]
                })
            }).addTo(map);

            polyline = L.polyline([selectedLocation, targetLatLng], { color: '#ef4444', weight: 3, dashArray: '5, 10' }).addTo(map);

            const bounds = L.latLngBounds([selectedLocation, targetLatLng]);
            map.fitBounds(bounds, { padding: [50, 50] });

            document.getElementById('result-location').innerText = `Lokalizacja: ${currentTarget.name} (${currentTarget.code})`;
            document.getElementById('result-distance').innerText = `Pomyłka o: ${distance.toFixed(1)} km`;
            document.getElementById('result-points').innerText = `+${points} pkt`;
            document.getElementById('total-score').innerText = totalScore;

            document.getElementById('result-modal').style.display = 'block';
            document.getElementById('guess-btn').disabled = true;
        }

        function nextRound() {
            if (currentRound < totalRounds) {
                currentRound++;
                document.getElementById('round-num').innerText = currentRound;
                startRound();
            } else {
                document.getElementById('result-title').innerText = "Koniec Gry!";
                document.getElementById('result-location').innerText = `Twój końcowy wynik: ${totalScore} / 25000 pkt! (Czas: ${elapsedTime.toFixed(1)}s)`;
                document.getElementById('result-distance').innerText = "";
                document.getElementById('result-points').innerText = "";
                
                document.getElementById('save-score-section').style.display = 'block';
                document.getElementById('leaderboard-section').style.display = 'block';
                updateLeaderboardUI();

                const nextBtn = document.getElementById('next-btn');
                nextBtn.innerText = "Zagraj ponownie";
                nextBtn.onclick = resetGame;
            }
        }

        function saveScore() {
            const input = document.getElementById('player-name-input');
            const name = input.value.trim() || "Anonim";

            let leaderboard = getLeaderboard();
            leaderboard.push({ name: name, score: totalScore, time: elapsedTime.toFixed(1) });
            leaderboard.sort((a, b) => {
                if (b.score !== a.score) {
                    return b.score - a.score;
                }
                return parseFloat(a.time) - parseFloat(b.time);
            });
            leaderboard = leaderboard.slice(0, 10);

            localStorage.setItem('plateguessr_leaderboard', JSON.stringify(leaderboard));

            updateLeaderboardUI();
            document.getElementById('save-score-section').style.display = 'none';
        }

        function resetGame() {
            currentRound = 1;
            totalScore = 0;
            usedPlates = [];
            elapsedTime = 0;
            document.getElementById('round-num').innerText = currentRound;
            document.getElementById('total-score').innerText = totalScore;
            document.getElementById('timer').innerText = "0.0";
            document.getElementById('result-title').innerText = "Wynik rundy";
            document.getElementById('player-name-input').value = "";
            
            const nextBtn = document.getElementById('next-btn');
            nextBtn.innerText = "Następna runda";
            nextBtn.onclick = nextRound;

            startRound();
        }
    </script>
</body>
</html>
